
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormPilot — Certifications</title>
  <link rel="stylesheet" href="../dashboard.css">
  <link rel="stylesheet" href="education.css">
</head>
<body>
  <main class="dashboard">
    <header class="page-header">
      <h1>Certifications</h1>
      <p>Manage your professional certificates and credentials.</p>
      <a href="../dashboard.html">← Back to Profile</a>
    </header>

    <section class="form-section">
      <h2 id="form-heading">Add Certification</h2>

      <form id="certification-form">
        <input type="hidden" name="id">

        <div class="form-grid">
          <label>Certification Name
            <input name="name" required>
          </label>

          <label>Issuing Organization
            <input name="issuer" required>
          </label>

          <label>Issue Date
            <input name="issueDate" type="date">
          </label>

          <label>Expiry Date
            <input name="expiryDate" type="date">
          </label>

          <label>Credential ID
            <input name="credentialId">
          </label>

          <label>Credential URL
            <input name="credentialUrl" type="url">
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-button">Add Certification</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="form-section">
      <h2>Your Certifications</h2>
      <div id="certification-list"></div>
    </section>
  </main>

  <script type="module" src="certifications.js"></script>
</body>
</html>
