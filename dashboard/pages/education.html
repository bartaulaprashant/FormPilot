
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormPilot — Education</title>
  <link rel="stylesheet" href="../dashboard.css">
  <link rel="stylesheet" href="education.css">
</head>
<body>
  <main class="dashboard">
    <header class="page-header">
      <h1>Education</h1>
      <p>Manage your academic background.</p>
      <a href="../dashboard.html">← Back to Profile</a>
    </header>

    <section class="form-section">
      <h2 id="form-heading">Add Education</h2>

      <form id="education-form">
        <input type="hidden" name="id">

        <div class="form-grid">
          <label>
            Institution
            <input name="institution" required>
          </label>

          <label>
            Degree
            <input name="degree" required>
          </label>

          <label>
            Field of Study
            <input name="fieldOfStudy">
          </label>

          <label>
            Grade / GPA
            <input name="grade">
          </label>

          <label>
            Start Date
            <input name="startDate" type="date">
          </label>

          <label>
            End Date
            <input name="endDate" type="date">
          </label>
        </div>

        <label class="description-field">
          Description
          <textarea name="description" rows="4"></textarea>
        </label>

        <label class="current-checkbox">
          <input type="checkbox" name="isCurrent">
          Currently studying here
        </label>

        <div class="form-actions">
          <button type="submit" id="submit-button">Add Education</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="form-section">
      <h2>Your Education</h2>
      <div id="education-list"></div>
    </section>
  </main>

  <script type="module" src="education.js"></script>
</body>
</html>
